name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Prepare APK Release Artifact
        run: |
          VERSION_TAG=${{ github.ref_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AiFriendship-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship ${{ github.ref_name }} 💬✨

            Pembaruan rilis besar **AiFriendship ${{ github.ref_name }}** menghadirkan pembenahan dan optimalisasi menyeluruh pada antarmuka pengguna (Frontend/UI), interaktivitas pesan yang lebih kaya, peningkatan performa Jetpack Compose, serta proteksi data pengguna.

            ### 🚀 Apa Saja Pembaruan di Versi Ini?
            - **Menu Aksi Pesan (Modal Bottom Sheet):** Tahan lama (*long press*) pesan mana saja untuk menyalin teks ke papan klip (*copy*) atau membalas pesan (*reply*) secara instan.
            - **Penyelarasan Desain Bubble Chat:** Penempatan timestamp dan centang pengiriman kini menyatu di sudut kanan bawah dalam bubble, menghadirkan estetika chat yang simetris, modern, dan padat.
            - **Proteksi Keamanan Data Pengguna:** Dilengkapi dialog konfirmasi sebelum melakukan aksi destruktif ("Hapus Sahabat AI" dan "Reset Obrolan") guna mencegah terhapusnya riwayat obrolan atau profil secara tidak sengaja.
            - **Optimasi Performa Jetpack Compose:** Animasi indikator mengetik kini berjalan di layout phase (bebas recomposition per-frame), proses filter watak ter-memoize, dan parsing warna avatar ter-cache sehingga obrolan lebih halus dan hemat baterai.
            - **Header Obrolan Bersih & Input Interaktif:** Header chat lebih lega dan tombol emoji/mic pada input bar memberikan respons panduan langsung.
            - **Keyboard Navigation pada Form Setup:** Tombol keyboard Next dan Done otomatis memindahkan fokus antar input dan menyimpan form tanpa harus menutup keyboard.
            - **Lebar Bubble Adaptif Responsif:** Lebar maksimal bubble chat kini dinamis mengikuti persentase layar, tampil ideal di layar ponsel kecil, layar standar, hingga tablet.
            - **Konsistensi Visual Indikator Mengetik:** Avatar dan warna karakter yang sedang mengetik selalu sinkron dengan sahabat AI aktif yang sedang diajak mengobrol.
            - **Arsitektur Bersih (DRY):** Komponen dialog pembaruan diekstraksi menjadi `AppUpdateDialog` yang seragam.

            ---

            ### 📲 Cara Memasang / Memperbarui:
            1. Unduh file **`AiFriendship-${{ github.ref_name }}.apk`** pada bagian **Assets** di bawah.
            2. Pasang langsung di smartphone Android Anda.
            3. Jika versi sebelumnya sudah terpasang, aplikasi juga dapat memperbarui dirinya sendiri secara otomatis via tombol "Install versi terbaru"!
          files: app/build/outputs/apk/debug/AiFriendship-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
