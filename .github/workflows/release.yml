name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Prepare APK Release Artifact
        run: |
          VERSION_TAG=${{ github.ref_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AiFriendship-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship ${{ github.ref_name }} 💬✨

            Pembaruan rilis **AiFriendship ${{ github.ref_name }}** menghadirkan penyempurnaan besar pada keseimbangan ritme obrolan (*Chat Mirroring*) dan respon emosional AI yang jauh lebih seimbang dan manusiawi.

            ### 🚀 Apa Saja Pembaruan di Versi Ini?
            - **Principles-Based Prompting (Bebas & Non-Template):** Seluruh contoh kalimat kaku di dalam tanda petik telah dihapus dari prompt. AI kini bebas mengekspresikan karakter uniknya secara alami dan organik tanpa terbelenggu template hafalan.
            - **Ekspresi Tersipu Spontan:** Reaksi salting kini dibebaskan sepenuhnya agar menunjukkan rasa salah tingkah yang murni organik mengikuti topik pembicaraan.
            - **Panjang Chat Dinamis Sesuai Topik:** AI menyesuaikan panjang pendeknya balasan dan jumlah bubble secara dinamis mengikuti kedalaman topik user.
            - **Kunci Keystore Terpadu (Solusi Permanen "App not installed"):** Seluruh rilis APK kini menggunakan `debug.keystore` terpadu, menjamin kompatibilitas tanda tangan untuk semua pembaruan aplikasi otomatis ke depannya tanpa ditolak sistem Android.
            - **Eliminasi Spam "wkwk":** Tawa buatan di setiap kalimat dihapus total, beralih ke gaya obrolan natural WhatsApp.
            - **Mood-Driven Dynamic Spam:** Frekuensi follow-up disesuaikan dengan suasana hati (Mood Manja, Kangen, Kepo, Ngambek dapat mengirim 2–3 chat berturut-turut; Mood Cuek/Biasa tetap kalem 1 chat).
            - **Auto-Cancel & Battery Guardrails:** Timer follow-up otomatis dibatalkan begitu Anda mengirim pesan baru. Jam tenang malam (00:00 – 07:00) tetap aktif.

            ---

            ### 📲 Cara Memasang / Memperbarui:
            1. Unduh file **`AiFriendship-${{ github.ref_name }}.apk`** pada bagian **Assets** di bawah.
            2. Pasang langsung di smartphone Android Anda.
            3. Jika versi sebelumnya sudah terpasang, aplikasi juga dapat memperbarui dirinya sendiri secara otomatis via tombol "Install versi terbaru"!
          files: app/build/outputs/apk/debug/AiFriendship-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
