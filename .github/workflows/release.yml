name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Prepare APK Release Artifact
        run: |
          VERSION_TAG=${{ github.ref_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AiFriendship-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship ${{ github.ref_name }} 💬✨

            Pembaruan rilis besar **AiFriendship ${{ github.ref_name }}** menghadirkan dukungan penuh **Multiple Companions** dengan 12 karakter kepribadian unik serta **Sistem Ingatan Jangka Panjang (Memory System)** yang membuat AI mengingat kehidupan dan preferensi Anda secara permanen.

            ### 🚀 Apa Saja Pembaruan di Versi Ini?
            - **Multiple Companions & Trait Selector:** Buat sahabat AI baru dengan memilih kepribadian yang Anda sukai dari 12 karakter unik (Barbar, Chill, Soft-Spoken, Tsundere, Cerdas, Absurd, dsb.) dalam kategori Santai, Hangat, Spicy, dan Cerdas, lengkap dengan rekomendasi nama dan avatar.
            - **Auto-Fact Extraction (Ingatan Jangka Panjang):** AI kini otomatis menyerap dan mencatat fakta-fakta penting tentang Anda (makanan favorit, hobi, hewan peliharaan, pekerjaan/kuliah, rencana penting) dari percakapan dan mengingatnya secara permanen.
            - **Buku Ingatan Sahabat (Memory Dialog):** Anda dapat melihat, menghapus, atau menambahkan fakta baru secara manual langsung dari chat atau dari tab Sahabat AI.
            - **Principles-Based Prompting (Bebas & Non-Template):** Seluruh contoh kalimat kaku telah dihapus dari prompt, membebaskan AI untuk berekspresi alami.
            - **Ekspresi Tersipu Spontan & Organik:** Reaksi salting organik mengikuti alur topik pembicaraan.
            - **Panjang Chat Dinamis Sesuai Topik:** AI menyesuaikan panjang respon secara seimbang mengikuti bobot topik user.
            - **Kunci Keystore Terpadu:** Seluruh rilis APK menggunakan keystore seragam, memastikan update otomatis berjalan mulus tanpa masalah instalasi.

            ---

            ### 📲 Cara Memasang / Memperbarui:
            1. Unduh file **`AiFriendship-${{ github.ref_name }}.apk`** pada bagian **Assets** di bawah.
            2. Pasang langsung di smartphone Android Anda.
            3. Jika versi sebelumnya sudah terpasang, aplikasi juga dapat memperbarui dirinya sendiri secara otomatis via tombol "Install versi terbaru"!
          files: app/build/outputs/apk/debug/AiFriendship-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
