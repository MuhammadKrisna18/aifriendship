name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Release Artifact
        run: |
          VERSION_TAG=${{ github.ref_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AiFriendship-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship ${{ github.ref_name }} 💬✨

            Pembaruan rilis **AiFriendship ${{ github.ref_name }}** menyempurnakan alur instalasi in-app update dan menghadirkan pengalaman pembaruan aplikasi yang mulus dan transparan.

            ### 🚀 Apa Saja Perbaikan di Versi Ini?
            - **Dialog Update Ringkas (2 Tombol):** Dialog pembaruan kini hanya memiliki 2 tombol yang jelas: **"Install versi terbaru"** dan **"Nanti Saja"** (menghilangkan tombol perantara browser).
            - **Indikator Kemajuan Unduhan Real-Time:** Menampilkan progress bar dan persentase unduhan (0% – 100%) langsung di dalam dialog, sehingga pengguna tahu proses unduh sedang berjalan aktif.
            - **Perbaikan Alur Package Installer:** Mengunduh file APK secara tuntas terlebih dahulu, menyelesaikan izin sumber tidak dikenal (*Unknown Sources*) secara tepat, dan mendaftarkan izin URI langsung ke Android Package Installer tanpa *silent failure*.
            - **AI Chat Proaktif Berbasis Konteks:** Sahabat AI tetap aktif menyapa duluan saat Anda lupa membalas chat, menanyakan kelanjutan topik sebelumnya, atau membagikan aktivitas terbarunya via push notification.

            ---

            ### 📲 Cara Memasang / Memperbarui:
            1. Unduh file **`AiFriendship-${{ github.ref_name }}.apk`** pada bagian **Assets** di bawah.
            2. Pasang langsung di smartphone Android Anda.
            3. Jika versi sebelumnya sudah terpasang, aplikasi juga dapat memperbarui dirinya sendiri secara otomatis via tombol "Install versi terbaru"!
          files: app/build/outputs/apk/debug/AiFriendship-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
