name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Prepare APK Release Artifact
        run: |
          VERSION_TAG=${{ github.ref_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AiFriendship-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship ${{ github.ref_name }} 💬✨

            Pembaruan rilis **AiFriendship ${{ github.ref_name }}** menghadirkan penyempurnaan besar pada keseimbangan ritme obrolan (*Chat Mirroring*) dan respon emosional AI yang jauh lebih seimbang dan manusiawi.

            ### 🚀 Apa Saja Pembaruan di Versi Ini?
            - **Eliminasi Spam "wkwk" & Nada Santai Otentik:** AI dilarang keras menempelkan "wkwk" di setiap kalimat/bubble. Mayoritas chat kini mengalir datar, santai, dan to-the-point tanpa tawa palsu yang kaku, persis seperti teman chatting nyata di WhatsApp.
            - **Chat Length Mirroring (Jawaban Seimbang & Tidak Kepanjangan):** AI kini mencerminkan panjang chat user secara proporsional. Chat singkat (1–5 kata) dibalas dengan **1 bubble ringkas** (tanpa monolog panjang atau multi-bubble berlebihan).
            - **Anti-Interogasi (Alur Mengalir Alami):** AI tidak lagi memaksakan pertanyaan balik di setiap akhir pesan. Percakapan mengalir santai layaknya obrolan WhatsApp dengan teman nyata.
            - **Reaksi Salting Super Dinamis (Anti-Template):** AI kini mengekspresikan rasa tersipu/salting dengan ragam reaksi alami: denial canggung (*pura-pura haus/kipas angin rusak*), panik lucu/speechless (*otak nge-blank*), tsundere sok galak (*"jangan bikin orang geer napa"*), ngetes ketulusan, meleleh jujur, hingga respon fisik realistis (*"refleks nutup muka pake bantal"*).
            - **Rapid Silence Follow-up (1–5 Menit):** Jika Anda tiba-tiba menghilang di tengah obrolan, AI akan menyapa santai dalam rentang acak 1–5 menit (*"Woy kok ngilang?", "Dih di-read doang"*).
            - **Deteksi Pamit Otomatis (10–60 Menit):** Jika Anda pamit (mandi, makan, otw, nugas, tidur), AI tidak mengganggu dan akan mengecek kembali kabar Anda setelah 10–60 menit (*"Udah kelar mandinya belum?", "Udah nyampe mana?"*).
            - **Mood-Driven Dynamic Spam:** Frekuensi follow-up disesuaikan dengan suasana hati (Mood Manja, Kangen, Kepo, Ngambek dapat mengirim 2–3 chat berturut-turut; Mood Cuek/Biasa tetap kalem 1 chat).
            - **Auto-Cancel & Battery Guardrails:** Timer follow-up otomatis dibatalkan begitu Anda mengirim pesan baru. Jam tenang malam (00:00 – 07:00) tetap aktif.

            ---

            ### 📲 Cara Memasang / Memperbarui:
            1. Unduh file **`AiFriendship-${{ github.ref_name }}.apk`** pada bagian **Assets** di bawah.
            2. Pasang langsung di smartphone Android Anda.
            3. Jika versi sebelumnya sudah terpasang, aplikasi juga dapat memperbarui dirinya sendiri secara otomatis via tombol "Install versi terbaru"!
          files: app/build/outputs/apk/debug/AiFriendship-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
