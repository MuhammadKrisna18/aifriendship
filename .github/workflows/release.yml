name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Pembaruan AiFriendship 💬✨
            
            Versi rilis terbaru dari aplikasi AI Companion **AiFriendship ("Lia")**.
            
            ### Cara Memasang / Memperbarui:
            - Unduh file `app-debug.apk` di bawah ini.
            - Pasang langsung di HP Android Anda.
            - Jika sudah terpasang, aplikasi dapat memperbarui dirinya sendiri secara otomatis saat ada rilis baru!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
